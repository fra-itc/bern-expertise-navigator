# Golden set, built from the REAL public pages (crawl of 2026-10-18). Each expected name was checked
# on the cited page. Names are matched case-, accent- and title-insensitively; a match on the unit
# (e.g. "Medical Image Analysis") also counts when the unit is the expected entity.
#
# Kinds: (a) site-terminology queries, (b) lay-term / other-language twins (twin_of -> must find the
# same experts), (c) out-of-domain and non-existent-person queries that must abstain.
# UniBE (u01-u16, added 2026-10-18 with the unibe_web source): chosen from the institute pages' own text, not from
# search results; each expected name was checked on its page, and a surname is used only where no other indexed
# name contains it.

queries:

# Places recognised in a free-text company search ("glucose company in Milan", "Firma aus München",
# "entreprise à Lyon", "azienda a Milano", "interpresa a Turitg").
# Names in English, German, French, Italian and Romansh (Rumantsch Grischun). Matching ignores case and accents.
# `strict: true` = the name is also an everyday word (e.g. German "Zug" = train), so it only counts after a
# place preposition ("in Zug", "aus Zug", "à Zoug").
# The `country` / `canton` values must match the app's lists (English names).

countries:
  - {name: Switzerland, names: [switzerland, swiss, schweiz, schweizer, schweizerische, suisse, svizzera, svizzero, svizra, svizzer]}
  - {name: Germany, names: [germany, german, deutschland, deutsche, deutsches, deutscher, allemagne, allemande, allemand, germania, tedesca, tedesco]}

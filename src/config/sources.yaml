# ---------------------------------------------------------------------------
# Data sources — the ONLY file you edit to add a new institution.
#
# Add a new site in 3 steps:
#   1. Copy one block below and change name/label/domains/seeds.
#   2. (Optional) add url patterns for person/unit/project/infrastructure pages.
#   3. Run:  make pipeline SOURCE=<name>
# ---------------------------------------------------------------------------

defaults:
  max_pages: 400            # per source, keeps the hackathon crawl bounded
  max_depth: 3
  delay_seconds: 0.5        # politeness
  user_agent: "HackApertus-ExpertiseNavigator/0.1 (+public research; contact: team)"
  languages: [de, en, fr]
  # Paths crawled first (fair coverage of people/groups before news pages)
  priority_keywords: [team, people, staff, mitarbeitende, personen, research, forschung,
                      group, gruppe, projects, projekte, lab, facilities, infrastructure, services]
  skip_keywords: [news, events, agenda, login, intranet, "/wp-json", "/feed", "xmlrpc", "/category/",
                  ".pdf", ".jpg", ".jpeg", ".png", ".svg", ".zip", ".docx", ".pptx", "mailto:", "tel:",
                  "?", "/images/", "/pictures/"]

sources:
  - name: artorg
    label: ARTORG Center for Biomedical Engineering Research
    domains: [artorg.unibe.ch]
    seeds: ["https://www.artorg.unibe.ch/research/index_eng.html",
            "https://www.artorg.unibe.ch/services/index_eng.html"]
    max_pages: 600
    max_depth: 4
    # UniBE CMS serves every page in DE and EN; crawl the English variant only
    extra_skip_keywords: [index_ger.html, index_fra.html, /publications/, /education/, /studies/]
    page_types:
      person: ["/group_members/"]
      infrastructure: ["/services/"]
      unit: ["/research/"]
      project: ["/projects/", "/projekte/"]

  - name: dcb
    label: Diabetes Center Berne
    domains: [dcberne.com]
    seeds: ["https://www.dcberne.com/en/team/", "https://www.dcberne.com/en/projects/",
            "https://www.dcberne.com/en/focus-areas/", "https://www.dcberne.com/en/offering/",
            "https://www.dcberne.com/en/"]
    max_pages: 300
    # Same content exists under /de/; keep the English site
    extra_skip_keywords: ["dcberne.com/de/", /wp-content/, /newsletters/, /media/, /career/, /legal-notice/,
                          /data-protection-statement/]
    page_types:
      person: ["/en/team/"]
      project: ["/projects/", "-study/"]
      infrastructure: ["/offering/"]
      unit: ["/focus-area", "/innovation/"]

  - name: unibe
    label: University of Bern (medtech / biomedical)
    # Medtech/biomedical perimeter only. Domains are suffix-matched (dbmr.unibe.ch also covers www.dbmr.unibe.ch).
    # Never list unibe.ch / www.unibe.ch: that would admit every faculty and duplicate ARTORG (a separate source).
    # Seeds and robots.txt verified 2026-10-18. Faculty/staff directory pages (/personenpool_index/) are included on purpose.
    domains: [medizin.unibe.ch, dbmr.unibe.ch, dcr.unibe.ch, ddm.unibe.ch, sitem.unibe.ch,
              ispm.unibe.ch, tki.unibe.ch, pki.unibe.ch, ibmm.unibe.ch, igmp.unibe.ch,
              ana.unibe.ch, physiologie.unibe.ch, ifik.unibe.ch, mcid.unibe.ch, bcpm.unibe.ch,
              scrm.unibe.ch, mic.unibe.ch, ngs.unibe.ch, bioinformatics.unibe.ch, cvrc.unibe.ch,
              iap.unibe.ch, neuroscience.unibe.ch]
    seeds:
      # groups/units first: equal priority is FIFO in seed order
      - https://www.dbmr.unibe.ch/research/research_programs/index_eng.html
      - https://www.tki.unibe.ch/research/research_groups/index_eng.html
      - https://www.pki.unibe.ch/research/research_groups/index_eng.html
      - https://www.ibmm.unibe.ch/research/group_leaders/index_eng.html
      - https://physiologie.unibe.ch/research/research_groups/index_eng.html
      - https://www.ispm.unibe.ch/research/research_groups_and_themes/index_eng.html
      - https://ddm.unibe.ch/research/research_programs/index_eng.html
      - https://www.iap.unibe.ch/research/biomedical_photonics/index_eng.html
      - https://www.bioinformatics.unibe.ch/research/projects/index_eng.html
      - https://www.medizin.unibe.ch/research/research_units/index_eng.html
      - https://www.medizin.unibe.ch/plattformen/index_eng.html
      # infrastructure / core facilities
      - https://www.medizin.unibe.ch/core_facilities/index_eng.html
      - https://www.dbmr.unibe.ch/services/core_facilities/index_eng.html
      - https://www.mic.unibe.ch/services
      - https://www.ngs.unibe.ch/services/applications
      - https://www.bioinformatics.unibe.ch/services/index_eng.html
      - https://dcr.unibe.ch/services/index_eng.html
      - https://www.pki.unibe.ch/services/index_eng.html
      - https://www.igmp.unibe.ch/services/index_eng.html
      - https://www.scrm.unibe.ch/platform/index_eng.html
      # institutes / people
      - https://www.sitem.unibe.ch/about_us/index_eng.html
      - https://www.bcpm.unibe.ch/research/projects_lighthouse
      - https://www.mcid.unibe.ch/about_us/mcid_members/index_eng.html
      - https://www.ispm.unibe.ch/about_us/ispm_team/index_eng.html
      - https://www.dbmr.unibe.ch/about_us/staff/personenpool_index/index_eng.html
      - https://www.igmp.unibe.ch/research/index_eng.html
    max_pages: 1500
    max_depth: 3
    delay_seconds: 1.0
    extra_skip_keywords: [artorg.unibe.ch, index_ger.html, index_fra.html, index_ita.html,
                          /studium/, /studies/, /studies_, /publications/, /publikationen/,
                          /continuing_education/, /teaching/, /about_us/job, /open_positions,
                          /annual_report, /media_release, /safety/, /annual_meeting, /newsletter]
    page_types:
      person: ["/personenpool_index/", "/about_us/personen/", "/mcid_members/", "/ispm_team/",
               "/about_us/members", "/members/", "/people/", "/group_members/", "/team/"]
      infrastructure: ["/core_facilities/", "/plattformen/", "/services/", "/platform/", "/dienstleistungen/", "/facilities/"]
      project: ["/projects", "/research_projects/", "/projekte/"]
      unit: ["/research_programs/", "/research_groups", "/research/group_", "/research/", "/about_us/", "/forschung/"]

  # Example of adding a 4th site (used in the live demo):
  # - name: insel
  #   label: Inselspital Research
  #   domains: [www.insel.ch]
  #   seeds: ["https://www.insel.ch/de/forschung"]
  #   max_pages: 200
